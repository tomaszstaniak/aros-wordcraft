id              = "wordcraft"
version         = "0.18.1"
summary         = "Word processor for DOCX, ODT, RTF and more with PDF export"
category        = "office/text"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "x86_64"
abi             = "v1"
subdir          = "WordCraft"
icon            = "WordCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "Mainline x86_64 ABIv1, built against the nightly 2026-11-10; needs a nightly from 2026-11-06 or later.",
  "On mainline x86_64 AUTO uses CPU: a program that opened OpenGL leaves its log file in use after it ends. GPU turns OpenGL on.",
  "The CPU renderer redraws only the parts of the window that changed; scrolling, zooming and other changes of the whole window are slower on slow machines.",
  "GUI_RENDERER ToolType: AUTO (default), CPU or GPU. AUTO uses OpenGL only when it is not Mesa software OpenGL.",
  "Settings, dictionary, fonts and WordCraft.log are kept in WordCraftData in the program drawer; keep it when upgrading.",
  "Clipboard text in the system character set or UTF-8; a picture on the clipboard is pasted with Ctrl+V.",
]

# System libraries the programs open: stdc, posixc and stdcio are the mainline C runtime the programs open at start;
# the others are opened for the window, pictures and requesters. gl.library only for
# GUI_RENDERER AUTO or GPU, codesets.library only when it is there.

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[[requires_system]]
type = "library"
id   = "asl.library"

[[requires_system]]
type = "library"
id   = "datatypes.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-wordcraft"
revision   = "v0.18.1"
archive    = "WordCraft-0.18.1-source.zip"
built_with = "x86_64 mainline ABIv1 (nightly 2026-11-10 SDK), GCC 10.5.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "WordCraft"
mode       = "workbench"
