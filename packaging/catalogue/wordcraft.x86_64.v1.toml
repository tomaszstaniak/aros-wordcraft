id              = "wordcraft"
version         = "0.16.0"
summary         = "Word processor for DOCX, ODT, RTF and more with PDF export"
category        = "office/text"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "x86_64"
abi             = "v1"
subdir          = "WordCraft"
icon            = "WordCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "Mainline x86_64 ABIv1, built against the nightly of 2026-11-05.",
  "The CPU draws the whole window on every change, so the interface reacts with a delay on slow machines.",
  "GUI_RENDERER ToolType: CPU (default), AUTO or GPU. With Mesa software OpenGL, AUTO uses CPU and GPU is slower.",
  "Settings, dictionary, fonts and WordCraft.log are kept in WordCraftData in the program drawer; keep it when upgrading.",
  "Clipboard text in the system character set or UTF-8; a picture on the clipboard is pasted with Ctrl+V.",
]

# System libraries the programs open; gl.library only for GUI_RENDERER AUTO or GPU,
# codesets.library only when it is there.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[[requires_system]]
type = "library"
id   = "asl.library"

[[requires_system]]
type = "library"
id   = "datatypes.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-wordcraft"
revision   = "v0.16.0"
archive    = "WordCraft-0.16.0-source.zip"
built_with = "x86_64 mainline ABIv1 (nightly 2026-11-05 SDK), GCC 10.5.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "WordCraft"
mode       = "workbench"
